[package]
name = "restqs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "REST Query Syntax parser for safe REST API filtering plans."
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/restqs"
repository = "https://github.com/OneTesseractInMultiverse/restqs"
authors = ["Pedro Guzmán"]
keywords = ["rest", "query", "filter", "sql", "api"]
categories = ["parser-implementations", "web-programming"]
include = [
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "Cargo.toml",
  "LICENSE",
  "Makefile",
  "README.md",
  "SECURITY.md",
  "SUPPORT.md",
  "docs/**",
  "examples/**",
  "src/**",
  "tests/**",
]

[features]
default = []
sqlx = []

[lib]
name = "restqs"
path = "src/lib.rs"

[dependencies]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
