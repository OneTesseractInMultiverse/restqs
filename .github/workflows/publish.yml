name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag matching Cargo.toml, for example v0.1.1"
        required: true
        type: string
      publish:
        description: "Publish after validation and environment approval"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-restqs
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve release revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the release tag
        id: release
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish }}
        run: python3 .github/scripts/release.py

  checks:
    name: Release checks
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  package:
    name: Validate release package
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Install Rust and coverage tools
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
          cargo install cargo-llvm-cov --locked --version 0.9.1

      - name: Check source line coverage
        run: make coverage

      - name: Inspect package contents
        run: make package-list

      - name: Publish dry run
        run: |
          cargo generate-lockfile
          cargo publish --dry-run --locked --registry crates-io

  publish:
    name: Publish to crates.io
    needs: [resolve, checks, package]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/restqs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify package before authentication
        run: |
          cargo generate-lockfile
          cargo publish --dry-run --locked --registry crates-io

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io
