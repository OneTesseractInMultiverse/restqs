name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Immutable commit to verify for a release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.85.0"
          - stable
    services:
      postgres:
        image: ${{ matrix.toolchain == 'stable' && 'postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929' || '' }}
        env:
          POSTGRES_USER: restqs
          POSTGRES_PASSWORD: restqs-test
          POSTGRES_DB: restqs
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U restqs -d restqs"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: ${{ matrix.toolchain == 'stable' && 'mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: restqs-root-test
          MYSQL_USER: restqs
          MYSQL_PASSWORD: restqs-test
          MYSQL_DATABASE: restqs
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prestqs-root-test --silent"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy,rustfmt
          rustup default "${{ matrix.toolchain }}"

      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Check
        run: make check

      - name: Lint
        if: matrix.toolchain == 'stable'
        run: make lint

      - name: Test
        run: make test

      - name: Test docs
        run: make test-doc

      - name: Verify SQLite repository
        run: make verify-sqlite

      - name: Verify parser and adapter properties
        timeout-minutes: 5
        env:
          PROPTEST_CASES: 256
          PROPTEST_RNG_SEED: 5394771
        run: make verify-properties

      - name: Verify PostgreSQL and MySQL repositories
        if: matrix.toolchain == 'stable'
        env:
          RESTQS_POSTGRES_URL: postgres://restqs:restqs-test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/restqs
          RESTQS_MYSQL_URL: mysql://restqs:restqs-test@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/restqs?ssl-mode=required
        run: make verify-services

      - name: Install fuzzing tools
        if: matrix.toolchain == 'stable'
        run: make fuzz-setup

      - name: Run bounded fuzz smoke tests
        if: matrix.toolchain == 'stable'
        timeout-minutes: 10
        run: make fuzz-smoke

      - name: Save robustness failure inputs
        if: failure() && matrix.toolchain == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robustness-failures
          path: |
            fuzz/artifacts/
            fuzz/corpus/
            integration-tests/robustness/regressions/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build docs
        run: make doc

      - name: Test release selection
        if: matrix.toolchain == 'stable'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Inspect package contents
        if: matrix.toolchain == 'stable'
        run: cargo package --list

      - name: Package
        if: matrix.toolchain == 'stable'
        run: cargo package

  quality:
    name: Quality policies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust and coverage tools
        run: |
          make coverage-setup
          rustup component add --toolchain 1.97.1 clippy rustfmt
          rustup default 1.97.1

      - name: Verify assertion policy
        run: make verify-test-policy

      - name: Require full source line coverage
        run: make coverage

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Audit dependencies
        run: |
          cargo generate-lockfile
          cargo audit
          cargo audit --file integration-tests/sqlite/Cargo.lock
          cargo audit --file integration-tests/services/Cargo.lock
          cargo audit --file integration-tests/robustness/Cargo.lock
          cargo audit --file fuzz/Cargo.lock
          cargo audit --file tools/test-policy/Cargo.lock
          rm -f Cargo.lock
