name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Immutable commit to verify for a release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.85.0"
          - stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy,rustfmt
          rustup default "${{ matrix.toolchain }}"

      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Check
        run: make check

      - name: Lint
        if: matrix.toolchain == 'stable'
        run: make lint

      - name: Test
        run: make test

      - name: Test docs
        run: make test-doc

      - name: Build docs
        run: make doc

      - name: Test release selection
        if: matrix.toolchain == 'stable'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Inspect package contents
        if: matrix.toolchain == 'stable'
        run: cargo package --list

      - name: Package
        if: matrix.toolchain == 'stable'
        run: cargo package

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Audit dependencies
        run: |
          cargo generate-lockfile
          cargo audit
          rm -f Cargo.lock
